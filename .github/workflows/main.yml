name: Build GawharaCoins

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build GawharaCoins JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Find and verify JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR_FILE="$(find target -maxdepth 1 -type f -name 'GawharaCoins-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          if [[ -z "$JAR_FILE" ]]; then
            echo "GawharaCoins JAR was not found in target/."
            echo "Files inside target/:"
            find target -maxdepth 1 -type f -printf '%f\n' || true
            exit 1
          fi
          echo "Found JAR: $JAR_FILE"
          jar tf "$JAR_FILE" | grep -qx 'plugin.yml'
          jar tf "$JAR_FILE" | grep -qx 'com/gawharasmp/coins/GawharaCoins.class'
          echo "JAR structure verified."

      - name: Upload GawharaCoins JAR
        uses: actions/upload-artifact@v4
        with:
          name: GawharaCoins-JAR
          path: target/GawharaCoins-*.jar
          if-no-files-found: error
          retention-days: 30
