name: GawharaCoins
version: 1.0.0
main: com.gawharasmp.coins.GawharaCoins
api-version: '26.3'
authors: [GawharaSMP]
description: Independent Gawhara Coins currency, public API and GUI shop.
commands:
  coins:
    description: View, transfer and spend Gawhara Coins.
    usage: /coins [balance|pay|top|shop|give|take|set|reload]
    aliases: [gc, gcoins]
permissions:
  gawharacoins.use:
    default: true
  gawharacoins.admin:
    default: op
